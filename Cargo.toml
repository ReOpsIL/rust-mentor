[package]
name = "rust-mentor"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal-based Rust tutor with AI-generated learning modules"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4.38"
directories = "6"
futures-util = "0.3"
rand = "0.9.1"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
regex = "1.11.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.28", features = ["derive"] }
syntect = "5.3"
textwrap = "0.16"
tokio = { version = "1.36", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3.19"
